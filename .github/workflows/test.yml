name: Test local example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm ci
      - run: npm test
      - run: npm run demo:mock
      - run: npm run demo:failure
      - run: node scripts/package-plugin.mjs
      - run: npm run plugin:unified:build
