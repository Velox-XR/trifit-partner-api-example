name: Publish illustrated WordPress preview
on:
  push:
    branches: [main]
    paths:
      - 'examples/wordpress/site/**'
      - '.github/workflows/wordpress-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wordpress-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/wordpress/site
      - name: Deploy static illustration only
        id: deployment
        uses: actions/deploy-pages@v4
